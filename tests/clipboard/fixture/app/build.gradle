plugins { id 'com.android.application' }
android {
    namespace 'com.paopaoime.clipboardregression'
    compileSdk 36
    defaultConfig {
        applicationId 'com.paopaoime.clipboardregression'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'com.paopaoime.clipboardregression.ClipboardInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
