tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn(prepareNoModelAssets)
}

tasks.matching { it.name.startsWith("generate") && it.name.contains("Lint") && it.name.endsWith("Model") }.configureEach {
    dependsOn(prepareNoModelAssets)
}

tasks.matching { it.name.startsWith("lint") && it.name.contains("Analyze") }.configureEach {
    dependsOn(prepareNoModelAssets)
}

def bridgeVersionName() {
    return rootProject.ext.oemSdkVersion.toString()
}

def bridgeVersionCode() {
    def segments = rootProject.ext.oemSdkVersion.toString().split('\\.')
    return segments.length > 3 ? segments[3].toInteger() : 1
}

static def bridgeBuildTime() {
    return new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("GMT+8"))
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = oemBridgeGroupId
                artifactId = oemBridgeArtifactId
                version = oemBridgeVersion

                pom {
                    name = 'Paopao OEM IME Host Bridge'
                    description = 'Third-stage OEM IME host bridge SDK for embedding the input method UI and service into enterprise hosts.'
                }
            }
        }

        repositories {
            maven {
                name = 'oemLocal'
                url = uri(oemLocalRepoDir)
            }
        }
    }
}
