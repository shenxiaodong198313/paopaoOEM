plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'io.objectbox'
}

import java.util.Properties

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newInputStream())
}
def resolveBuildProperty = { String key, String fallback ->
    def envValue = System.getenv(key)
    if (envValue != null && envValue.toString().trim()) return envValue.toString()
    def localValue = localProperties.getProperty(key)
    if (localValue != null && localValue.toString().trim()) return localValue.toString()
    def projectValue = project.findProperty(key)
    if (projectValue != null && projectValue.toString().trim()) return projectValue.toString()
    return fallback
}
def withoutEmbeddedModelAssets = resolveBuildProperty("WITHOUT_EMBEDDED_MODEL_ASSETS", "true").toBoolean()
def filteredNoModelAssetsDir = layout.buildDirectory.dir("generated/noModelAssets").get().asFile
def oemBridgeGroupId = 'com.paopaoime.oem'
def oemBridgeArtifactId = 'oem-ime-host-bridge'
def oemBridgeVersion = bridgeVersionName()
def oemLocalRepoDir = rootProject.layout.buildDirectory.dir('oem-sdk-repo')

def prepareNoModelAssets = tasks.register("prepareNoModelAssets", Copy) {
    from("../assets")
    into(filteredNoModelAssetsDir)
    exclude("sherpa_model/**")
}

// OemHostRuntime 依赖内核类，归属 host-bridge；core 模块已将其从源码集排除
def syncHostBridgeSlice = tasks.register("syncHostBridgeSlice", Sync) {
    from("../app/src/main/java/com/paopaoime/aikeyboard/sdk/core") {
        include("OemHostRuntime.kt")
    }
    into(layout.buildDirectory.dir("bridge-slice-src"))
}

