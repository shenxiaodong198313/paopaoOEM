# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx8192m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false
kotlin.daemon.jvm.options=-Xmx2048m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
android.injected.build.model.only.versioned = 3
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=true
android.suppressUnsupportedCompileSdk=36
# AGP 9 compatibility bridge for third-party plugins still using BaseExtension.
android.newDsl=false
android.ndkVersion=28.0.13004108
ndkVersion=28.0.13004108
# Force ai-ime native build to use the stable CMake expected by existing scripts.
cmakeVersion=3.22.1
android.lint.useK2Uast=true
android.suppressUnsupportedOptionWarnings=android.lint.useK2Uast
android.lint.checkDependencies=false
# Required stellar host configuration for SDK publication:
automationEngineApplicationId=tanke.keyboard.ime.ai
automationEngineDefaultAllowedPackages=tanke.keyboard.ime.ai,tanke.keyboard.ime.ai.debug,tanke.keyboard.ime.standard,tanke.keyboard.ime.standard.debug
# OEM SDK unified release version (single source of truth for all com.paopaoime.oem artifacts).
# Format: 1.0.0.<build>; <build> is a date stamp (yyyyMMdd). When publishing a new release,
# only bump the tail number (multiple releases on the same day use yyyyMMdd1/yyyyMMdd2, e.g. 202608151).
oemSdkVersion=1.0.0.20261012
# AUTH_SECRET is supplied by local.properties or the environment.

