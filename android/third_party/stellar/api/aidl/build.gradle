plugins {
    id('com.android.library')
}

ext.stellarPublishVersion = '1.1'
apply from: rootProject.file('third_party/stellar/publish-local.gradle')

android {
    namespace 'com.stellar.aidl'
    compileSdk 36
    defaultConfig {
        minSdk 24
    }
    buildFeatures {
        buildConfig false
        aidl true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

