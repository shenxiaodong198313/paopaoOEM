plugins {
    id 'com.android.library'
    id 'dev.rikka.tools.refine'
}

ext.stellarPublishVersion = '1.1'
apply from: rootProject.file('third_party/stellar/publish-local.gradle')

android {
    namespace 'com.stellar.server'
    compileSdk 36
    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        buildConfig = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
}
dependencies {
    implementation serverLibs.androidxAnnotation

    implementation serverLibs.gson

    api serverLibs.parcelablelist

    implementation project(':stellar-aidl')
    implementation project(':stellar-shared')
    compileOnly project(':stellar-provider')
    compileOnly project(':stellar-shizuku-aidl')
    implementation project(':stellar-shizuku-api')

    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
    implementation libs.refine.runtime
}

