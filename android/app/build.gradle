    def keystorePropsFile = rootProject.file("keystore/keystore.properties")
    def keystoreProps = new Properties()
    def keystoreStoreFile = null
    def hasValidKeystore = false
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
        keystoreStoreFile = file("${rootProject.projectDir}/keystore/" + keystoreProps["storeFile"])
        hasValidKeystore = keystoreStoreFile.exists()
    }

    signingConfigs {
        release {
            if (hasValidKeystore) {
                storeFile keystoreStoreFile
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
                v1SigningEnabled = true
                v2SigningEnabled = true
            }
        }
        debug {
            if (hasValidKeystore) {
                storeFile keystoreStoreFile
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
                v1SigningEnabled = true
                v2SigningEnabled = true
            }
        }
    }

    buildTypes {
        release {
            // Keep release behavior close to debug for runtime stability:
            // several dynamic feature paths (IME / model loaders / voice chain)
            // are sensitive to aggressive shrinking/obfuscation.
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            if (hasValidKeystore) {
