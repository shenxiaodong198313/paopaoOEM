static def versionCodeDate() {
    def now = new Date()
    def tz = TimeZone.getTimeZone("GMT+8")
    def yearOffset = Integer.valueOf(now.format("yyyy", tz)) - 2026
    def dayOfYear = Integer.valueOf(now.format("DDD", tz))
    def hour = Integer.valueOf(now.format("HH", tz))
    def minute = Integer.valueOf(now.format("mm", tz))
    def minuteOfYear = ((dayOfYear - 1) * 24 * 60) + (hour * 60) + minute
    def versionCode = 2100000000 + (yearOffset * 600000) + minuteOfYear
    return String.valueOf(versionCode)
}

static def versionNameDate() {
    return new Date().format("yyyyMMdd.HHmm", TimeZone.getTimeZone("GMT+8"))
}

