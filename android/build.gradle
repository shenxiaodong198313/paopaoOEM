import java.util.Properties

def rootLocalProperties = new Properties()
def rootLocalPropertiesFile = rootProject.file("local.properties")
if (rootLocalPropertiesFile.exists()) {
    rootLocalProperties.load(rootLocalPropertiesFile.newInputStream())
}
def resolveRootProperty = { String key, String fallback ->
    def envValue = System.getenv(key)
    if (envValue != null && envValue.toString().trim()) return envValue.toString()
    def localValue = rootLocalProperties.getProperty(key)
    if (localValue != null && localValue.toString().trim()) return localValue.toString()
    def projectValue = gradle.startParameter.projectProperties.get(key)
    if (projectValue != null && projectValue.toString().trim()) return projectValue.toString()
    return fallback
}

