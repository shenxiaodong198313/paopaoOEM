ext.api_version_major = 1
ext.api_version_minor = 0
ext.api_version_patch = 3
ext.api_version_name = "${ext.api_version_major}.${ext.api_version_minor}.${ext.api_version_patch}"
ext.api_version_code = ext.api_version_major * 100 + ext.api_version_minor * 10 + ext.api_version_patch

ext.serverConfig = [
        authBaseUrl: resolveRootProperty("AUTH_BASE_URL", 'https://paopaoime.com')
]

// OEM SDK unified version: every com.paopaoime.oem artifact publishes with this version.
// Single source of truth lives in gradle.properties (oemSdkVersion); releases only bump that one place.
ext.oemSdkVersion = (findProperty('oemSdkVersion') ?: '1.0.0.202608248').toString()

tasks.register('clean', Delete) {
    delete project.layout.buildDirectory
}

tasks.register('packageDebug') {
    group = 'build'
    dependsOn(':app:assembleDebug')
    doLast {
        def apkDir = file("$rootDir/app/build/outputs/apk")
        if (!apkDir.exists()) {
            throw new GradleException("APK output directory not found: ${apkDir}")
        }
        println("")
        println("Debug APK outputs:")
        fileTree(apkDir).matching { include '**/*debug*.apk' }.files.sort { it.absolutePath }.each { f ->
            println(f.absolutePath)
        }
    }
}

tasks.register('installDebug') {
    group = 'build'
    dependsOn(':app:installDebug')
}

tasks.register('packageRelease') {
    group = 'build'
    dependsOn(':app:assembleRelease')
    doLast {
        def apkDir = file("$rootDir/app/build/outputs/apk")
        if (!apkDir.exists()) {
            throw new GradleException("APK output directory not found: ${apkDir}")
        }
        println("")
        println("Release APK outputs:")
        fileTree(apkDir).matching { include '**/*release*.apk' }.files.sort { it.absolutePath }.each { f ->
            println(f.absolutePath)
        }
    }
}
